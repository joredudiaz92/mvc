name: Build and Push Docker Image

on:
#  pull_request:
#    branches:
#      - main
#    types: [ closed ]
  push:
    branches:
      - main

jobs:
  build_and_push:
    #if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: build
        uses: spring-io/spring-gradle-build-action@v2
        with:
          java-version: 25
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'         # Especifica la versión 25
          distribution: 'temurin'    # Temurin (Adoptium) ya ofrece binarios de Java 25
          cache: 'gradle'
      - name: Create tag
        run: |
          git clean -fd
          git checkout .
          ./gradlew semver -x test -x check --patch --stacktrace --scan
      - name: Get tag
        id: generate_tag
        run: |
          tag=$(cat gradle.properties  | grep "version" | cut -d "=" -f 2)
          echo "TAG=$tag" >> $GITHUB_OUTPUT
        shell: bash
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mvc:${{ steps.generate_tag.outputs.TAG }}