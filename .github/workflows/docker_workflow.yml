name: Build and Push Docker Image

on:
#  pull_request:
#    branches:
#      - main
#    types: [ closed ]
  push:
    branches:
      - main

jobs:
  build_and_push:
    #if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3 # Official action for caching and configuration
      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew # Ensures the script has execute permissions
      - name: Create tag
        run: ./gradlew semver -x test -x check --patch --stacktrace
      - name: Get tag
        id: generate_string
        run: |
          tag=$(cat gradle.properties  | grep "version" | cut -d "=" -f 2)
          echo "TAG=tag" >> $GITHUB_OUTPUT
        shell: bash
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mvc:${{ steps.generate_string.outputs.TAG }}